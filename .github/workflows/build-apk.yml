name: Build Flet Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.24.0'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up site-packages for serious_python
        run: |
          mkdir -p build/site-packages
          pip install -t build/site-packages -r requirements.txt
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$PWD/build/site-packages" >> $GITHUB_ENV
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Inject API Keys (config.py)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          keys = {
              "DEEPSEEK_API_KEY": os.environ.get("DEEPSEEK_API_KEY", ""),
              "TTS_API_KEY": os.environ.get("TTS_API_KEY", ""),
              "ASR_API_KEY": os.environ.get("ASR_API_KEY", ""),
          }
          with open("config.py", "w", encoding="utf-8") as f:
              for k, v in keys.items():
                  f.write(f'{k} = "{v}"\n')
          EOF
      - name: Build APK
        run: flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lingxi-App
          path: build/apk
